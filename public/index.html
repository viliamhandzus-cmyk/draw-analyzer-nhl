<!doctype html><html lang="sk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d30"><link rel="manifest" href="/manifest.json"><title>DRAW ANALYZER NHL</title><style>body{background:#101d30;color:#edf5ff;font:16px system-ui;margin:auto;max-width:900px;padding:20px}section{background:#1d3048;padding:18px;border-radius:14px;margin:16px 0}button,input{font:inherit;padding:10px;border-radius:8px;border:0;margin:4px}button{background:#79d8e7;color:#102030;cursor:pointer}small{color:#b9c8d9}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #456} .scroll{overflow:auto}canvas{width:100%;background:#142438}</style><h1>DRAW ANALYZER NHL <small>1.0</small></h1><p>CONSENSUS · Remíza po 60 minútach · Virtuálny test</p><button onclick="refresh()">Aktualizovať</button><section id="status">Načítavam...</section><section><h2>História</h2><p id="stats"></p><button onclick="exportCSV()">Export CSV</button><div class="scroll"><table><thead><tr><th>Deň</th><th>Zápas</th><th>Hlasy</th><th>Kurz</th><th>Výsledok</th></tr></thead><tbody id="hist"></tbody></table></div><canvas id="chart" width="800" height="200"></canvas><small>Graf: pevný vklad (tyrkysová), zdvojnásobovanie (oranžová). Iba zelené predikcie s vyplneným kurzom; žlté sú sledované samostatne. História je uložená v tomto prehliadači.</small></section><script>
let history=JSON.parse(localStorage.getItem('nhl-history-v1')||'[]');const $=id=>document.getElementById(id);function save(){localStorage.setItem('nhl-history-v1',JSON.stringify(history));}const pct=x=>(x*100).toFixed(2)+' %';function render(){history.sort((a,b)=>a.date.localeCompare(b.date));$('hist').replaceChildren();let fixed=0,mart=0,step=0,series=0,max=0,points=[[0,0]],blocked=false;for(const r of history){const tr=document.createElement('tr');for(const v of [r.date,r.home+' – '+r.away,r.votes]){const td=tr.insertCell();td.textContent=v;}const input=document.createElement('input');input.type='number';input.min='1.01';input.step='.01';input.value=r.odds||'';input.style.width='70px';input.onchange=()=>{r.odds=+input.value>1?+input.value:null;save();render();};tr.insertCell().append(input);tr.insertCell().textContent=r.draw==null?'Čaká':r.draw?'Remíza':'Bez remízy';$('hist').append(tr);if(r.votes>=3){if(r.draw==null||!r.odds)blocked=true;if(!blocked){const gain=r.draw?r.odds-1:-1;fixed+=gain;mart+=gain*2**step;step=r.draw?0:(step+1)%5;series=r.draw?0:series+1;max=Math.max(max,series);points.push([fixed,mart]);}}}const rates=[2,3].map(k=>{const a=history.filter(r=>(k===2?r.votes===2:r.votes>=3)&&r.draw!=null);return (k===2?'Žlté':'Zelené')+': '+a.filter(r=>r.draw).length+'/'+a.length;});$('stats').textContent=rates.join(' | ')+' | Pevný: '+fixed.toFixed(2)+' € | Dvojnásobný: '+mart.toFixed(2)+' € | Max. séria: '+max+(blocked?' | Simulácia čaká na chýbajúci kurz/výsledok':'');const c=$('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const lo=Math.min(-1,...points.flat()),hi=Math.max(1,...points.flat());for(let k=0;k<2;k++){ctx.beginPath();ctx.strokeStyle=k?'#ffad65':'#79d8e7';ctx.lineWidth=3;points.forEach((p,i)=>{const x=10+i*780/Math.max(1,points.length-1),y=190-(p[k]-lo)*180/(hi-lo);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}}
async function refresh(){try{const r=await fetch('/api/today');const d=await r.json();if(!r.ok)throw Error(d.error);const g=d.selection,old=history.find(x=>x.date===d.date);let msg=d.incomplete?'⚪ Neúplné údaje':d.started&&!old?'⚪ Denný výber už nemožno uzamknúť po začiatku zápasov':!g||g.p.votes<2?'🔴 Dnes nie je vhodná predikcia':g.p.votes>=3?'🟢 Silná experimentálna zhoda':'🟡 Zápas na sledovanie';if(!old&&!d.incomplete&&!d.started&&g&&g.p.votes>=2){history.push({...g,date:d.date,votes:g.p.votes,draw:null,odds:null});save();}const pick=history.find(x=>x.date===d.date);if(pick)msg=(pick.votes>=3?'🟢':'🟡')+' Uzamknutý výber: '+pick.home+' – '+pick.away+' | '+pick.votes+'/4';$('status').textContent=d.date+' (NHL) — '+msg+(d.warning?' | '+d.warning:'');if(g&&g.p){const p=document.createElement('p');p.textContent='Najlepší dostupný kandidát: '+g.home+' – '+g.away+' | L '+pct(g.p.L)+' | X '+pct(g.p.X)+' | B '+(g.p.B?'áno':'nie')+' | H '+(g.p.H?'áno':'nie');$('status').append(p);}}catch(e){$('status').textContent='⚪ Dáta nedostupné: '+e.message;}for(const r of history.filter(x=>x.draw==null)){try{const q=await(await fetch('/api/result?id='+r.id)).json();if(q.draw===0||q.draw===1)r.draw=q.draw;}catch{}}save();render();}function exportCSV(){const s=['date,id,home,away,votes,odds,draw',...history.map(r=>[r.date,r.id,r.home,r.away,r.votes,r.odds??'',r.draw??''].join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='nhl-historia.csv';a.click();URL.revokeObjectURL(a.href);}render();refresh();setInterval(refresh,900000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script></html>
